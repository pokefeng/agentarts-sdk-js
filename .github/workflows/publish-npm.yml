name: Publish to npm

# 打 tag（v*）时发布以下四个包到 npm（各自独立发布，互不等待）：
#   - @huaweicloud/huaweicloud-sdk-agentidentity
#   - @huaweicloud/agentarts-sdk
#   - @huaweicloud/agentarts-protocol-a2a（可选协议适配器）
#   - @huaweicloud/agentarts-protocol-agui（可选协议适配器）
#
# 版本约定：
#   tag 形如 v0.0.1，且必须与 packages/agentarts-sdk 的 version 一致；
#   其余三个包按各自 package.json 的 version 发布（与 tag 不同会给出告警）。
#   目标版本已存在时自动跳过，便于重复打 tag 或只升其中一个包。
#
# 仓库配置：
#   Secrets  : NPM_TOKEN           必填，npm Automation token（需 @huaweicloud scope 发布权限）
#   Variables: NPM_REGISTRY_URL    可选，默认 https://registry.npmjs.org
#              NPM_PROVENANCE      可选，'true' 时对 npmjs 启用 provenance

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: build、测试、打包校验，但不发布'
        type: boolean
        default: true
      tag:
        description: '可选：待校验的 tag（如 v0.0.1）。留空则使用 package.json 中的版本'
        type: string
        required: false

permissions:
  contents: read
  # 仅当 NPM_PROVENANCE=true 且发布到 registry.npmjs.org 时使用
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '12.21.0'
  REGISTRY_URL: ${{ vars.NPM_REGISTRY_URL || 'https://registry.npmjs.org' }}
  NPM_PROVENANCE: ${{ vars.NPM_PROVENANCE || 'false' }}

jobs:
  verify:
    name: Build, test & pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      dry_run: ${{ steps.meta.outputs.dry_run }}
      sdk_version: ${{ steps.meta.outputs.sdk_version }}
      identity_version: ${{ steps.meta.outputs.identity_version }}
      a2a_version: ${{ steps.meta.outputs.a2a_version }}
      agui_version: ${{ steps.meta.outputs.agui_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: ${{ env.REGISTRY_URL }}

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Resolve versions and validate tag
        id: meta
        # 四个包的版本解析与 tag 校验集中在 scripts/publish-meta.mjs，
        # 本地可用 `node scripts/publish-meta.mjs` 校验，并有单元测试覆盖。
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/publish-meta.mjs

      - name: Copy README/LICENSE into packages
        # npm 只从包目录收集 README/LICENSE；复制后才会进入 tarball。
        # 两个协议包自带 README/LICENSE，不覆盖。
        run: |
          cp README.md LICENSE packages/agentarts-sdk/
          cp README.md LICENSE packages/huaweicloud-sdk-agentidentity/

      - name: Validate npm tarballs
        shell: bash
        run: |
          set -euo pipefail
          PACK_DIR="${RUNNER_TEMP}/packs"
          rm -rf "${PACK_DIR}"
          mkdir -p "${PACK_DIR}"

          pack_and_check() {
            local name="$1"
            local required_file="$2"
            local tarball slug file_list package_json expected

            tarball="$(pnpm --filter "${name}" pack --pack-destination "${PACK_DIR}" | tail -n 1)"

            if [[ ! -f "${tarball}" ]]; then
              echo "::error::Failed to create tarball for ${name}"
              exit 1
            fi

            echo "Packed ${name} -> ${tarball}"

            # 先把文件列表和 package.json 完整写入文件再匹配：`grep -q` 命中后会提前
            # 关闭管道，让 tar 收到 SIGPIPE（`tar: stdout: write error`），在
            # `set -o pipefail` 下整条管道返回非零，会被误判成"tarball 缺少文件"。
            # 所以这里不写 `tar -tzf ... | grep -qx ...`。
            slug="$(printf '%s' "${name}" | tr '/@' '__')"
            file_list="${PACK_DIR}/${slug}.files.txt"
            package_json="${PACK_DIR}/${slug}.package.json"
            tar -tzf "${tarball}" > "${file_list}"
            tar -xOf "${tarball}" package/package.json > "${package_json}"

            for expected in "package/dist/index.js" "package/README.md" "package/LICENSE"; do
              if ! grep -qx "${expected}" "${file_list}"; then
                echo "::error::${name} tarball is missing ${expected}"
                echo "--- ${file_list} ---"
                head -n 40 "${file_list}"
                exit 1
              fi
            done
            if [[ -n "${required_file}" ]] && ! grep -qx "${required_file}" "${file_list}"; then
              echo "::error::${name} tarball is missing ${required_file}"
              echo "--- ${file_list} ---"
              head -n 40 "${file_list}"
              exit 1
            fi
            if grep -q '"workspace:' "${package_json}"; then
              echo "::error::${name} tarball still contains 'workspace:' dependencies (pnpm should rewrite them)"
              exit 1
            fi
          }

          pack_and_check "@huaweicloud/huaweicloud-sdk-agentidentity" ""
          pack_and_check "@huaweicloud/agentarts-sdk" "package/dist/assets/toolkit/plugins/memory/resources/scripts/_shared.mjs"
          pack_and_check "@huaweicloud/agentarts-protocol-a2a" ""
          pack_and_check "@huaweicloud/agentarts-protocol-agui" ""

      - name: Write summary
        shell: bash
        env:
          SDK_VERSION: ${{ steps.meta.outputs.sdk_version }}
          IDENTITY_VERSION: ${{ steps.meta.outputs.identity_version }}
          A2A_VERSION: ${{ steps.meta.outputs.a2a_version }}
          AGUI_VERSION: ${{ steps.meta.outputs.agui_version }}
          DRY_RUN: ${{ steps.meta.outputs.dry_run }}
        run: |
          {
            echo "### npm publish: $( [[ "${DRY_RUN}" == "true" ]] && echo 'dry run' || echo 'publish' )"
            echo ""
            echo "| Package | Version | Registry |"
            echo "| --- | --- | --- |"
            echo "| @huaweicloud/huaweicloud-sdk-agentidentity | ${IDENTITY_VERSION} | ${REGISTRY_URL} |"
            echo "| @huaweicloud/agentarts-sdk | ${SDK_VERSION} | ${REGISTRY_URL} |"
            echo "| @huaweicloud/agentarts-protocol-a2a | ${A2A_VERSION} | ${REGISTRY_URL} |"
            echo "| @huaweicloud/agentarts-protocol-agui | ${AGUI_VERSION} | ${REGISTRY_URL} |"
          } >> "${GITHUB_STEP_SUMMARY}"

  publish:
    name: Publish packages
    needs: verify
    if: needs.verify.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: ${{ env.REGISTRY_URL }}

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Copy README/LICENSE into packages
        run: |
          cp README.md LICENSE packages/agentarts-sdk/
          cp README.md LICENSE packages/huaweicloud-sdk-agentidentity/

      - name: Publish to npm
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          npm_config_registry: ${{ env.REGISTRY_URL }}
          SDK_VERSION: ${{ needs.verify.outputs.sdk_version }}
          IDENTITY_VERSION: ${{ needs.verify.outputs.identity_version }}
          A2A_VERSION: ${{ needs.verify.outputs.a2a_version }}
          AGUI_VERSION: ${{ needs.verify.outputs.agui_version }}
        run: |
          set -euo pipefail

          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "::error::NPM_TOKEN secret is not configured. Add an npm Automation token in repository secrets."
            exit 1
          fi

          RESULTS="${RUNNER_TEMP}/publish-results.txt"
          : > "${RESULTS}"

          publish_package() {
            local name="$1"
            local version="$2"
            local dist_tag="latest"

            if npm view "${name}@${version}" version --registry "${REGISTRY_URL}" >/dev/null 2>&1; then
              echo "::notice::${name}@${version} already exists on ${REGISTRY_URL}; skipping."
              echo "${name}|${version}|skipped (already published)" >> "${RESULTS}"
              return 0
            fi

            # 预发布版本发布到 next，稳定版本发布到 latest。
            if [[ "${version}" == *-* ]]; then
              dist_tag="next"
            fi

            local args=(--no-git-checks --access public --tag "${dist_tag}")
            if [[ "${NPM_PROVENANCE}" == "true" && "${REGISTRY_URL}" == https://registry.npmjs.org* ]]; then
              args+=(--provenance)
            fi

            echo "::group::Publishing ${name}@${version} (dist-tag: ${dist_tag})"
            pnpm --filter "${name}" publish "${args[@]}"
            echo "::endgroup::"

            echo "${name}|${version}|published" >> "${RESULTS}"
          }

          # 四个包各自独立发布：不判断包之间的先后依赖，也不等待其他包先出现在 registry 上。
          # 已存在的版本照旧跳过，便于重复打 tag 或只升其中一个包。
          publish_package "@huaweicloud/huaweicloud-sdk-agentidentity" "${IDENTITY_VERSION}"
          publish_package "@huaweicloud/agentarts-sdk" "${SDK_VERSION}"
          publish_package "@huaweicloud/agentarts-protocol-a2a" "${A2A_VERSION}"
          publish_package "@huaweicloud/agentarts-protocol-agui" "${AGUI_VERSION}"

          {
            echo "### npm publish results"
            echo ""
            echo "| Package | Version | Result |"
            echo "| --- | --- | --- |"
            while IFS='|' read -r name version result; do
              echo "| ${name} | ${version} | ${result} |"
            done < "${RESULTS}"
          } >> "${GITHUB_STEP_SUMMARY}"
